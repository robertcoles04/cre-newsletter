name: Publish CRE Blurb

on:
  issues:
    types: [labeled]
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pages: write
  id-token: write

jobs:
  # Step 1: check the draft and record the date in issues/published.json.
  # Runs once per approved Issue; never cancelled, so no approval is dropped.
  record:
    if: >-
      github.event_name == 'issues' &&
      github.event.label.name == 'approved' &&
      startsWith(github.event.issue.title, 'Draft: CRE Blurb ')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: record-${{ github.event.issue.number }}
      cancel-in-progress: false
    outputs:
      day: ${{ steps.day.outputs.day }}
    steps:
      - name: Read the date from the Issue title
        id: day
        env:
          TITLE: ${{ github.event.issue.title }}
          ISSUE: ${{ github.event.issue.number }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "$TITLE" =~ ^Draft:\ CRE\ Blurb\ ([0-9]{4}-[0-9]{2}-[0-9]{2})$ ]]; then
            echo "day=${BASH_REMATCH[1]}" >> "$GITHUB_OUTPUT"
          else
            gh issue comment "$ISSUE" --repo "$GITHUB_REPOSITORY" \
              --body "Could not read a date from the title. Expected: Draft: CRE Blurb YYYY-MM-DD"
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Check the issue is safe to publish
        id: gate
        env:
          DAY: ${{ steps.day.outputs.day }}
        run: |
          set -o pipefail
          python -m src.publish "$DAY" 2>&1 | tee gate.txt

      - name: Report gate failure and remove the label
        if: failure() && steps.gate.outcome == 'failure'
        env:
          DAY: ${{ steps.day.outputs.day }}
          ISSUE: ${{ github.event.issue.number }}
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "Not published. Fix these in issues/$DAY.md, then add the \`approved\` label again:"
            echo
            cat gate.txt
          } > comment.md
          gh issue comment "$ISSUE" --repo "$GITHUB_REPOSITORY" --body-file comment.md
          gh issue edit "$ISSUE" --repo "$GITHUB_REPOSITORY" --remove-label approved

      - name: Save the published list
        env:
          DAY: ${{ steps.day.outputs.day }}
        run: |
          git config user.name "cre-blurb-bot"
          git config user.email "cre-blurb-bot@users.noreply.github.com"
          git add issues/published.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "publish: $DAY"
          for attempt in 1 2 3; do
            if git pull --rebase origin main && git push origin HEAD:main; then
              exit 0
            fi
            echo "push attempt $attempt failed; retrying"
            # Another approval may have edited published.json at the same spot:
            # start again from the latest main and re-record this date.
            git rebase --abort 2>/dev/null || true
            git fetch origin main && git reset --hard origin/main
            python -m src.publish "$DAY" > /dev/null
            git add issues/published.json
            git diff --cached --quiet || git commit -m "publish: $DAY"
            sleep 5
          done
          exit 1

      - name: Report a failure after the check passed
        if: failure() && steps.gate.outcome == 'success'
        env:
          ISSUE: ${{ github.event.issue.number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue comment "$ISSUE" --repo "$GITHUB_REPOSITORY" \
            --body "Publishing failed after the check passed; remove and re-add the approved label to retry. Run: $RUN_URL"
          gh issue edit "$ISSUE" --repo "$GITHUB_REPOSITORY" --remove-label approved

  # Step 2: rebuild the whole site from main and deploy it. A newer deploy
  # replaces an older one; every recorded date is in main, so nothing is lost.
  deploy:
    needs: record
    if: >-
      always() &&
      (github.event_name == 'workflow_dispatch' || needs.record.result == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: pages
      cancel-in-progress: true
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main  # fresh checkout so it includes the just-pushed published.json

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Build the site
        run: python -m src.site build --out site

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4

      - name: Comment and close the Issue
        if: github.event_name == 'issues'
        env:
          DAY: ${{ needs.record.outputs.day }}
          ISSUE: ${{ github.event.issue.number }}
          GH_TOKEN: ${{ github.token }}
        # Site URL is hard-coded; keep it in sync with SITE_URL in src/site.py.
        run: |
          gh issue comment "$ISSUE" --repo "$GITHUB_REPOSITORY" \
            --body "Published: https://creblurb.org/issues/$DAY/"
          gh issue close "$ISSUE" --repo "$GITHUB_REPOSITORY"
