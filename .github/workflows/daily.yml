name: Daily CRE Blurb

on:
  schedule:
    # Two triggers so the run lands around 5-6 AM ET in both EST and EDT.
    # The pipeline is idempotent (one file + one GitHub Issue per date).
    - cron: "7 9 * * *"
    - cron: "7 10 * * *"
    # Backups at odd minutes (busy :00 slots are the ones GitHub delays or drops; runs
    # have started 6 to 7 hours late). The 5 AM to 5:59 PM ET gate and the
    # already-delivered check keep it to one issue a day; later runs just skip.
    - cron: "13 9 * * *"
    - cron: "43 9 * * *"
    - cron: "13 10 * * *"
    - cron: "43 10 * * *"
    - cron: "13 11 * * *"
    - cron: "43 11 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Force a run even if the gate says skip"
        type: boolean
        default: false

permissions:
  contents: write
  issues: write
  actions: write  # to start publish.yml (auto-publish)

# Never let the two cron triggers overlap.
concurrency:
  group: daily
  cancel-in-progress: false

jobs:
  draft:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Claude Code CLI
        run: npm i -g @anthropic-ai/claude-code

      - name: Restore database from data branch (ok if it does not exist yet)
        run: |
          git fetch origin data && git show origin/data:cre.db > cre.db || true
          # An empty file from a failed show would confuse sqlite; drop it.
          [ -s cre.db ] || rm -f cre.db

      - name: Create draft label
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh label create draft --color BFD4F2 || true
          gh label create approved --color 0E8A16 || true

      - name: Run pipeline
        id: pipeline
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          ALPHA_VANTAGE_API_KEY: ${{ secrets.ALPHA_VANTAGE_API_KEY }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          GH_TOKEN: ${{ github.token }}
          FORCE: ${{ inputs.force }}
        run: |
          args="--db cre.db"
          if [ "$FORCE" = "true" ]; then args="$args --force"; fi
          python -m src.main $args

      - name: Save database to data branch
        if: ${{ always() && hashFiles('cre.db') != '' }}
        run: |
          if [ -f cre.db ]; then
            git config user.name "cre-blurb-bot"
            git config user.email "cre-blurb-bot@users.noreply.github.com"
            wt="$(mktemp -d)"
            cp cre.db "$wt/cre.db"
            git worktree add --detach "$wt/wt" HEAD
            cd "$wt/wt"
            git checkout --orphan data-snapshot
            git rm -rf --quiet .
            cp "$wt/cre.db" cre.db
            git add -f cre.db
            git commit -m "data: cre.db snapshot"
            git push -f origin HEAD:data
          fi

      - name: Commit issues/ to main
        env:
          REF: ${{ github.ref_name }}
        run: |
          git config user.name "cre-blurb-bot"
          git config user.email "cre-blurb-bot@users.noreply.github.com"
          if [ -n "$(git status --porcelain issues/)" ]; then
            git add issues/
            git commit -m "draft: issue for $(date -u +%F)"
            git pull --rebase origin "$REF"
            git push origin HEAD:"$REF"
          fi

      # Auto-publish: ask publish.yml to publish this draft. It runs the same
      # safety check as the approved label; if the check fails it comments on the
      # Issue and leaves it open for a manual fix + `approved`. Adding the label
      # here would not work: events made with GITHUB_TOKEN start no workflows,
      # but workflow_dispatch is allowed. Runs only after issues/ is on main.
      - name: Auto-publish the draft
        if: steps.pipeline.outputs.issue != ''
        env:
          ISSUE: ${{ steps.pipeline.outputs.issue }}
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run publish.yml --repo "$GITHUB_REPOSITORY" --ref main -f issue="$ISSUE"
