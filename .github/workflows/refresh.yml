name: Refresh slow stats

# The 30-year mortgage rate (Freddie Mac, Thursdays around noon ET) and the high-yield
# spread (FRED, a day late) often post after the morning issue is drafted. This re-reads
# them for the latest published issue so /markets/ never lags. It changes only
# issues/<date>.json and the mortgage chart, never the Markdown or published.json, and
# never runs the publish gate. A change is committed, then publish.yml is started to
# rebuild the site (pushes made with GITHUB_TOKEN start no workflows by themselves).
on:
  schedule:
    # About 12:30 PM and 4:30 PM ET on weekdays. Two slots each so the times hold in
    # both daylight time (UTC-4) and standard time (UTC-5); extra runs find no change.
    # Odd minutes because GitHub delays or drops busy :00 slots.
    - cron: "37 16 * * 1-5"
    - cron: "37 17 * * 1-5"
    - cron: "37 20 * * 1-5"
    - cron: "37 21 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write
  actions: write  # to start publish.yml (site rebuild)

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Refresh the latest issue
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: python -m src.refresh

      - name: Commit and push if anything changed
        id: commit
        run: |
          if [ -n "$(git status --porcelain issues/*.md issues/published.json)" ]; then
            echo "::error::Refresh changed an issue's Markdown or published.json; not committing."
            exit 1
          fi
          git config user.name "cre-blurb-bot"
          git config user.email "cre-blurb-bot@users.noreply.github.com"
          git add issues/*.json issues/img/
          if git diff --cached --quiet; then
            echo "No change."
            echo "pushed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "refresh: slow stats for the latest issue"
          for attempt in 1 2 3; do
            if git pull --rebase origin main && git push origin HEAD:main; then
              echo "pushed=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "push attempt $attempt failed; retrying from the latest main"
            git rebase --abort 2>/dev/null || true
            git fetch origin main && git reset --hard origin/main
            python -m src.refresh
            git add issues/*.json issues/img/
            if git diff --cached --quiet; then
              echo "pushed=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            git commit -m "refresh: slow stats for the latest issue"
            sleep 5
          done
          exit 1
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}

      - name: Rebuild the site
        if: steps.commit.outputs.pushed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run publish.yml --repo "$GITHUB_REPOSITORY" --ref main
